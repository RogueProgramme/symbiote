<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The primary redirect mechanism: instantly refreshes to the new URL -->
    <meta http-equiv="refresh" content="0; url=https://youtu.be/7JTv7_sB34E">
    <!-- 2. Helps search engines find the real source of your content -->
    <link rel="canonical" href="https://youtu.be/7JTv7_sB34E">
</head>
<body>
    <!-- 3. Fallback link if the user's browser blocks the automatic refresh -->
    <p>If you are not redirected automatically, please follow this <a href="https://youtu.be/7JTv7_sB34E">link to our new website</a>.</p>
</body>
</html>
